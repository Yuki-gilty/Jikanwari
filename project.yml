name: Jikanwari
options:
  bundleIdPrefix: com.yukiyamamoto
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: G6X2AA2PJX
    CODE_SIGN_STYLE: Automatic
schemes:
  Jikanwari:
    build:
      targets:
        Jikanwari: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  Jikanwari:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: JikanwariWidget
      - target: JikanwariIntents
    entitlements:
      path: Sources/Jikanwari.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yukiyamamoto.jikanwari]
    info:
      path: Sources/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        # 授業が始まったら、終わった休み時間のLive Activityをバックグラウンドで消す
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.yukiyamamoto.jikanwari.liveactivity-cleanup]
        # 英語のSiriでは「時間割」と言えないので、Jikanwari / Timetable でも呼べるようにする
        INAlternativeAppNames:
          - INAlternativeAppName: Jikanwari
            INAlternativeAppNamePronunciationHint: jee kahn wah ree
          - INAlternativeAppName: Timetable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukiyamamoto.jikanwari
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ドルトン時間割
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 紙の時間割をスキャンして読み込むためにカメラを使います
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPadは全方向に回せるようにしてSplit View / Stage Managerでも使えるようにする
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
  JikanwariWidget:
    type: app-extension
    platform: iOS
    # 次の授業・今日・今週のウィジェットは、アプリが保存した時間割（App Group）を読む
    sources:
      - Widget
      - Shared
      - Sources/Timetable.swift
      - Sources/NextClass.swift
    entitlements:
      path: Widget/JikanwariWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yukiyamamoto.jikanwari]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ドルトン時間割
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukiyamamoto.jikanwari.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
  # Siriの「次の授業」などをアプリを開かずに答える App Intents 拡張
  JikanwariIntents:
    type: extensionkit-extension
    platform: iOS
    sources:
      - Intents
      - Sources/Timetable.swift
      - Sources/NextClass.swift
    entitlements:
      path: Intents/JikanwariIntents.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yukiyamamoto.jikanwari]
    info:
      path: Intents/Info.plist
      properties:
        CFBundleDisplayName: ドルトン時間割
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.appintents-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yukiyamamoto.jikanwari.intents
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
